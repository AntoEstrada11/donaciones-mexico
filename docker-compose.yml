# Stack Gitea → Portainer.
# OBLIGATORIO: desplegar como Compose (standalone / docker compose).
# NO usar Swarm: Swarm ignora `build` y `restart`, y falla con
# "invalid image reference for service web: no image specified".
services:
  db:
    image: postgres:17-alpine
    container_name: donaciones-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-donaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-donaciones}
      POSTGRES_DB: ${POSTGRES_DB:-donaciones}
    # Solo loopback. En la PC: npm run db:up (solo este servicio). En Portainer no hace falta abrirlo.
    ports:
      - '${POSTGRES_BIND:-127.0.0.1:5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-donaciones} -d ${POSTGRES_DB:-donaciones}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - donaciones

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: donaciones-web
    restart: unless-stopped
    # Lista (no mapa con condition): Portainer/Swarm exige depends_on como array.
    depends_on:
      - db
    ports:
      - '${WEB_BIND:-0.0.0.0:3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-donaciones}:${POSTGRES_PASSWORD:-donaciones}@db:5432/${POSTGRES_DB:-donaciones}
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:-cambia-este-secreto-en-portainer}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
      NUXT_PUBLIC_AUTH_HUB_URL: ${NUXT_PUBLIC_AUTH_HUB_URL:-http://159.54.159.34:8000}
      NUXT_PUBLIC_APP_CODE: ${NUXT_PUBLIC_APP_CODE:-donaciones}
      NUXT_CHURCHES_API_URL: ${NUXT_CHURCHES_API_URL:-https://miembros.iurdsys.net/api/churches}
      NUXT_CHURCHES_API_KEY: ${NUXT_CHURCHES_API_KEY:-}
      NUXT_CHURCHES_API_ALLOWED_HOST: ${NUXT_CHURCHES_API_ALLOWED_HOST:-miembros.iurdsys.net}
      NUXT_PAYMENT_WEBHOOK_BASE_URL: ${NUXT_PAYMENT_WEBHOOK_BASE_URL:-}
      NUXT_MP_ACCESS_TOKEN_TEST: ${NUXT_MP_ACCESS_TOKEN_TEST:-}
      NUXT_MP_ACCESS_TOKEN_LIVE: ${NUXT_MP_ACCESS_TOKEN_LIVE:-}
      NUXT_MP_WEBHOOK_SECRET_TEST: ${NUXT_MP_WEBHOOK_SECRET_TEST:-}
      NUXT_MP_WEBHOOK_SECRET_LIVE: ${NUXT_MP_WEBHOOK_SECRET_LIVE:-}
      NUXT_PAYPAL_CLIENT_ID_TEST: ${NUXT_PAYPAL_CLIENT_ID_TEST:-}
      NUXT_PAYPAL_CLIENT_ID_LIVE: ${NUXT_PAYPAL_CLIENT_ID_LIVE:-}
      NUXT_PAYPAL_CLIENT_SECRET_TEST: ${NUXT_PAYPAL_CLIENT_SECRET_TEST:-}
      NUXT_PAYPAL_CLIENT_SECRET_LIVE: ${NUXT_PAYPAL_CLIENT_SECRET_LIVE:-}
      NUXT_PAYPAL_WEBHOOK_ID_TEST: ${NUXT_PAYPAL_WEBHOOK_ID_TEST:-}
      NUXT_PAYPAL_WEBHOOK_ID_LIVE: ${NUXT_PAYPAL_WEBHOOK_ID_LIVE:-}
    volumes:
      - uploads:/app/public/uploads
      - uploads:/app/.output/public/uploads
    networks:
      - donaciones

volumes:
  db-data:
  uploads:

networks:
  donaciones:
    driver: bridge
